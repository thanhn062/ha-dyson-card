name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

  validate-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check card syntax
        run: node --check ha-dyson-card.js
      - name: Run regression tests
        run: node tests/regressions.mjs

  validate-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Fetch supported upstream integration
        run: curl -fLsS https://github.com/cmgrayb/hass-dyson/releases/download/v0.38.0/hass_dyson.zip -o /tmp/hass_dyson.zip
      - name: Verify installation and preset behavior
        run: python companion/test_installer.py /tmp/hass_dyson.zip

  validate-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install supported Home Assistant test runtime
        run: pip install homeassistant==2026.10.0
      - name: Verify movement policy and independent installation
        run: |
          python tests/test_direction_movement.py
          python tests/test_direction_install.py
      - name: Verify Home Assistant setup, migration and persistence
        run: python tests/test_direction_integration.py

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
